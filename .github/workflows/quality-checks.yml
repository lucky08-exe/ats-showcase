name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Assurance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # UV_PYTHON overrides .python-version (pinned to 3.12) so every uv call uses the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --all-extras && uv run python --version

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_md

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run type checking
        run: uv run mypy src/ tests/

      - name: Run tests with coverage
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/ -v --ignore=tests/poc -m "not perf" --cov=src -n auto --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run performance tests (serial, advisory)
        id: perf
        # Wall-clock budget tests run alone, without xdist or coverage, so CPU contention
        # does not flake them. Advisory: failures are reported but do not fail the job (#570).
        continue-on-error: true
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/ -v --ignore=tests/poc -m perf -n 0 --no-cov

      - name: Surface advisory perf test failure
        if: always() && steps.perf.outcome == 'failure'
        run: |
          {
            echo "### Advisory perf tests failed"
            echo ""
            echo "Python ${{ matrix.python-version }}: see the 'Run performance tests' step. Job conclusion unchanged (advisory)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Advisory perf tests failed::Python ${{ matrix.python-version }}: see the 'Run performance tests' step"

  quality-poc:
    name: Quality Assurance (poc)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # UV_PYTHON overrides .python-version (pinned to 3.12) so every uv call uses the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --all-extras && uv run python --version

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_md

      - name: Run poc tests with coverage
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/poc/ -v --cov=src -n auto --cov-report=xml

      - name: Upload poc coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests-poc
          name: codecov-umbrella-poc
          fail_ci_if_error: false
