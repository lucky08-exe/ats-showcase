name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Assurance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # UV_PYTHON overrides .python-version (pinned to 3.12) so every uv call uses the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --all-extras && uv run python --version

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_md

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run type checking
        run: uv run mypy src/ tests/

      - name: Run tests with coverage
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/ -v --cov=src -n auto --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
